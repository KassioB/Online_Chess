<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pawnthon: uma cobra (python) enrolada formando a silhueta de um peão -->
  <rect width="64" height="64" rx="14" fill="#00224D"/>

  <g stroke="#5D0E41" stroke-width="1.6">
    <!-- ponta do rabo saindo da volta de baixo -->
    <path d="M47 53 C 54 53.5, 58 50, 56.5 45.5" fill="none" stroke="#FF204E" stroke-width="3.4" stroke-linecap="round"/>

    <!-- voltas do corpo, de baixo para cima (cada uma por cima da anterior): base e corpo do peão -->
    <ellipse cx="32" cy="50" rx="19" ry="5.6" fill="#FF204E"/>
    <ellipse cx="32" cy="44.2" rx="15.2" ry="5" fill="#FF204E"/>
    <ellipse cx="32" cy="38.8" rx="12.2" ry="4.5" fill="#FF204E"/>
    <ellipse cx="32" cy="33.8" rx="9.8" ry="4" fill="#FF204E"/>
    <!-- pescoço subindo até a cabeça -->
    <path d="M26.5 30 V 20 H 37.5 V 30" fill="#FF204E"/>
    <!-- gola do peão -->
    <ellipse cx="32" cy="28" rx="11.5" ry="3.2" fill="#FF204E"/>
  </g>

  <!-- brilho em cima e escamas embaixo de cada volta -->
  <g fill="none" stroke-linecap="round">
    <path d="M17 48.6 Q 32 44.8, 47 48.6" stroke="#ff7a96" stroke-width="1.5"/>
    <path d="M20.5 42.9 Q 32 39.6, 43.5 42.9" stroke="#ff7a96" stroke-width="1.4"/>
    <path d="M23 37.7 Q 32 34.9, 41 37.7" stroke="#ff7a96" stroke-width="1.3"/>
    <path d="M25.5 32.9 Q 32 30.6, 38.5 32.9" stroke="#ff7a96" stroke-width="1.2"/>
    <path d="M24 27.2 Q 32 25.2, 40 27.2" stroke="#ff7a96" stroke-width="1.1"/>
    <path d="M15 51.6 Q 32 56.8, 49 51.6" stroke="#A0153E" stroke-width="1.8" stroke-dasharray="1.4 3"/>
    <path d="M19 45.8 Q 32 50.4, 45 45.8" stroke="#A0153E" stroke-width="1.6" stroke-dasharray="1.4 3"/>
    <path d="M22 40.3 Q 32 44.4, 42 40.3" stroke="#A0153E" stroke-width="1.5" stroke-dasharray="1.4 2.8"/>
    <path d="M24.5 35.2 Q 32 38.8, 39.5 35.2" stroke="#A0153E" stroke-width="1.4" stroke-dasharray="1.4 2.6"/>
  </g>

  <!-- cabeça da cobra = cabeça do peão -->
  <ellipse cx="32" cy="14.5" rx="9.8" ry="8.8" fill="#FF204E" stroke="#5D0E41" stroke-width="1.6"/>
  <path d="M25 11 Q 32 7, 39 11" fill="none" stroke="#ff7a96" stroke-width="1.4" stroke-linecap="round"/>
  <!-- olhos de cobra (pupila em fenda) -->
  <ellipse cx="27.8" cy="14.2" rx="2.7" ry="2.1" transform="rotate(18 27.8 14.2)" fill="#ffffff"/>
  <ellipse cx="36.2" cy="14.2" rx="2.7" ry="2.1" transform="rotate(-18 36.2 14.2)" fill="#ffffff"/>
  <ellipse cx="28" cy="14.3" rx=".7" ry="1.7" fill="#000000"/>
  <ellipse cx="36" cy="14.3" rx=".7" ry="1.7" fill="#000000"/>
  <!-- narinas -->
  <circle cx="30.6" cy="18.6" r=".6" fill="#5D0E41"/>
  <circle cx="33.4" cy="18.6" r=".6" fill="#5D0E41"/>
  <!-- língua bifurcada -->
  <path d="M32 21.5 V 24.6 M32 24.6 l-1.6 1.9 M32 24.6 l1.6 1.9" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
