# Gera o aplicativo baixável (Windows e Linux) e anexa à release quando uma tag "v*" é enviada:
#   git tag v1.0.0 && git push origin v1.0.0
name: Aplicativo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt
      - run: python web/build_desktop.py
      - name: Compacta o executável do Linux
        if: runner.os == 'Linux'
        run: tar -czf dist/PawnthonChess-linux.tar.gz -C dist PawnthonChess
      - uses: actions/upload-artifact@v4
        with:
          name: PawnthonChess-${{ runner.os }}
          path: |
            dist/PawnthonChess.exe
            dist/PawnthonChess-linux.tar.gz
          if-no-files-found: ignore
      - name: Anexa à release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PawnthonChess.exe
            dist/PawnthonChess-linux.tar.gz
