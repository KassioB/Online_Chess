# Gera o aplicativo Android (.apk) com o Buildozer / python-for-android.
# Roda a cada alteração do cliente na main (baixe o .apk em Actions > a execução > Artifacts),
# manualmente, e em tags "v*" (aí o .apk também vai para a release com o nome PawnthonChess.apk).
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - buildozer.spec
      - .github/workflows/android.yml
      - .github/scripts/**
      - web/pawnthon/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool             pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Cache do Buildozer (SDK/NDK e receitas)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      - run: pip install buildozer cython==0.29.37 virtualenv
      - name: Compila o aplicativo
        run: set -o pipefail; buildozer android debug 2>&1 | tee build.log
      - name: Mostra o fim do log (aparece nas anotações da execução)
        if: failure()
        run: python3 .github/scripts/tail_log.py < build.log
      - name: Renomeia o .apk
        run: cp bin/*.apk PawnthonChess.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PawnthonChess-Android
          path: PawnthonChess.apk
      - name: Anexa à release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PawnthonChess.apk
